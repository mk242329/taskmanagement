# PR と main への push で、フロントエンドとバックエンドのチェックを自動で動かす
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しく push したら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: フロントエンド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: lint（oxlint）
        run: npm run lint
      - name: 整形のチェック（Prettier）
        run: npx prettier --check .
      - name: テスト（Vitest）
        run: npm test -- --run
      - name: 型チェックとビルド
        run: npm run build

  backend:
    name: バックエンド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Testcontainers はランナーの Docker で PostgreSQL を起動する（Colima 用の環境変数は要らない）
      - name: テスト（JUnit・Testcontainers）
        run: ./mvnw -B test
