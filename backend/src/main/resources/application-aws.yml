# AWS（Lambda）で動かすときの設定。Lambda の環境変数 SPRING_PROFILES_ACTIVE=aws で有効になる
taskapp:
  dynamodb:
    # 空にすると、AWS の DynamoDB（Lambda と同じリージョン）につなぐ
    endpoint: ""
    # テーブルは Terraform（infra/database.tf）が作る。名前は Lambda の環境変数で渡す
    cards-table: ${TASKAPP_CARDS_TABLE}
    counters-table: ${TASKAPP_COUNTERS_TABLE}
    create-tables: false
