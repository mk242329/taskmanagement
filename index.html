<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- SC-01 ① ヘッダー -->
  <header class="header">
    <h1 class="header-title">タスク管理</h1>

    <!-- プロトタイプ用：未決事項の比較パネル（本番では削除する） -->
    <div class="proto-panel">
      <span class="proto-label">プロトタイプ設定</span>
      <label>
        「期限切れ」の文字
        <select id="proto-overdue-text">
          <option value="show">表示する</option>
          <option value="hide">表示しない</option>
        </select>
      </label>
      <label>
        削除確認
        <select id="proto-delete-dialog">
          <option value="custom">アプリ独自</option>
          <option value="browser">ブラウザ標準</option>
        </select>
      </label>
      <button type="button" id="proto-reset" class="btn btn-small">サンプルデータに戻す</button>
    </div>
    <!-- /プロトタイプ用 -->
  </header>

  <!-- SC-01 ボード画面 -->
  <main class="board">
    <section class="list" data-list-id="todo">
      <h2 class="list-title">未着手 (<span class="list-count">0</span>)</h2>
      <div class="card-area"></div>
      <button type="button" class="add-button">＋ タスクを追加</button>
    </section>
    <section class="list" data-list-id="doing">
      <h2 class="list-title">作業中 (<span class="list-count">0</span>)</h2>
      <div class="card-area"></div>
      <button type="button" class="add-button">＋ タスクを追加</button>
    </section>
    <section class="list" data-list-id="done">
      <h2 class="list-title">完了 (<span class="list-count">0</span>)</h2>
      <div class="card-area"></div>
      <button type="button" class="add-button">＋ タスクを追加</button>
    </section>
  </main>

  <!-- SC-02 カード編集ウィンドウ -->
  <dialog id="edit-dialog" class="dialog">
    <form id="edit-form" class="edit-form" novalidate>
      <h2 id="edit-heading" class="dialog-heading">タスクの追加</h2>

      <div class="form-row">
        <label for="input-title">タイトル（必須）</label>
        <div class="form-field">
          <input type="text" id="input-title" autocomplete="off">
          <p id="title-error" class="error-message"></p>
        </div>
      </div>

      <div class="form-row">
        <label for="input-description">説明文</label>
        <div class="form-field">
          <textarea id="input-description" rows="4" maxlength="500"></textarea>
        </div>
      </div>

      <div class="form-row">
        <label for="input-due">期限</label>
        <div class="form-field">
          <input type="datetime-local" id="input-due">
        </div>
      </div>

      <div class="form-row">
        <label for="input-strict">時間厳守</label>
        <div class="form-field">
          <label class="checkbox-label">
            <input type="checkbox" id="input-strict">
            遅れてはいけないタスク（優先度が1段階上がる）
          </label>
        </div>
      </div>

      <div class="form-row">
        <span class="form-label">優先度</span>
        <div class="form-field form-field-text">
          <span id="priority-preview" class="priority"></span>
          <span class="form-hint">期限と時間厳守から自動で決まります</span>
        </div>
      </div>

      <div class="dialog-buttons">
        <button type="button" id="delete-button" class="btn btn-danger">削除</button>
        <div class="dialog-buttons-right">
          <button type="button" id="cancel-button" class="btn">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- SC-03 削除確認ダイアログ（アプリ独自の見た目） -->
  <dialog id="confirm-dialog" class="dialog dialog-small">
    <p class="confirm-message">このタスクを削除しますか？</p>
    <div class="dialog-buttons dialog-buttons-end">
      <button type="button" id="confirm-cancel" class="btn">キャンセル</button>
      <button type="button" id="confirm-ok" class="btn btn-danger">OK</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
