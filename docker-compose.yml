# フォルダ名に日本語が含まれるため、プロジェクト名（コンテナ名の先頭）を固定する
name: taskapp

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: taskapp
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
