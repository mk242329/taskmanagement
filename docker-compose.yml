# フォルダ名に日本語が含まれるため、プロジェクト名（コンテナ名の先頭）を固定する
name: taskapp

services:
  # 開発用の DynamoDB（AWS の DynamoDB と同じ API で動く DynamoDB Local）
  db:
    image: amazon/dynamodb-local:3.3.2
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    # ボリュームに書き込めるよう root で動かす（イメージの既定のユーザーには書き込み権限がない）
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data

volumes:
  dynamodb-data:
